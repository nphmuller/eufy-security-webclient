<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eufy Live View</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/live.css">
    <script defer src="/js/video.js"></script>
    <script defer src="/js/live.js"></script>
</head>
<body>
    <main class="live">
        <header>
            <h1>Eufy Live View</h1>
            <a href="/advanced">Advanced</a>
        </header>
        <div id="camera-choice" hidden>
            <label for="camera-select">Camera</label>
            <select id="camera-select"></select>
        </div>
        <section class="viewer" aria-label="Live video">
            <p id="camera-name" class="placeholder">Live video is off</p>
            <video id="device-video-video" controls autoplay muted playsinline hidden></video>
            <p id="device-video-errorMessage" role="alert"></p>
            <span id="device-video-buffer" hidden></span>
        </section>
        <button id="device-video-btn" type="button" disabled>Start Live View</button>
        <p id="live-status" role="status">Connecting…</p>
    </main>
</body>
</html>
